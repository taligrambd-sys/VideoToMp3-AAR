plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kaalsoft.videomp3'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs = ['../../java']
            jniLibs.srcDirs = ['../../aar-staging/jniLibs']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
