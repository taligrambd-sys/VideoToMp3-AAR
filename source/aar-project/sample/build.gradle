plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kaalsoft.videomp3.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kaalsoft.videomp3.sample'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':videomp3')
}
